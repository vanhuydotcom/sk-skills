name: validate

on:
  push:
  pull_request:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate SKILL.md frontmatter against the Agent Skills spec
        run: |
          pipx install skills-ref || pip install skills-ref
          fail=0
          for d in skills/*/; do
            agentskills validate "$d" || fail=1
          done
          exit $fail

      - name: Check install.sh syntax
        run: bash -n install.sh
